<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090c1c">
<meta property="og:title" content="Quán Nhậu Dzô">
<meta property="og:description" content="Mở quán nhậu vỉa hè, nướng mồi, rót bia, né phạt. Mỗi ngày một đêm thử thách, xếp hạng với mọi người!">
<title>Quán Nhậu Dzô</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Patrick+Hand&display=swap">
<style>
/* Layout: the game fills the viewport. Portrait: HUD, hint, street scene, kitchen stacked. Landscape/tablet: scene on the left, HUD + kitchen on the right. Single night theme on purpose. */
:root{
  --night:#090c1c; --panel:#161b35; --line:#2d3460; --ink:#f4f1ea; --muted:#a7aecb;
  --bulb:#ffd166; --good:#5fe0a0; --bad:#ff7466; --red:#d8342c;
  --f-sign:"Bungee",Impact,sans-serif; --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif; --f-hand:"Patrick Hand","Be Vietnam Pro",cursive;
  --sw:360px; --kw:360px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);height:100%}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow-x:hidden}
@media (min-width:700px){body{font-size:16.5px}}
#app{min-height:100%;padding-inline:16px;padding-block:10px 16px;display:flex;justify-content:center;align-items:flex-start}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible{outline:3px solid var(--bulb);outline-offset:2px}
.lab{font-size:.73em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* game grid */
#game{display:grid;gap:8px;justify-content:center;align-content:start;grid-template-columns:var(--sw);grid-template-areas:"hud" "hint" "scene" "kit"}
#game.land{grid-template-columns:var(--sw) var(--kw);grid-template-areas:"scene hud" "scene hint" "scene kit";grid-template-rows:auto auto 1fr;column-gap:16px}
#game.menu{grid-template-areas:"scene" "panel"}
#game.menu.land{grid-template-columns:var(--sw) minmax(0,460px);grid-template-areas:"scene panel";grid-template-rows:auto;align-items:start}
#game.full{grid-template-columns:minmax(0,600px);grid-template-areas:"panel"}
#hud{grid-area:hud} #hint{grid-area:hint} #stage{grid-area:scene} #kit{grid-area:kit} #panel{grid-area:panel;display:flex;flex-direction:column;gap:10px;min-width:0}
#game.menu #hud,#game.menu #hint,#game.menu #kit,#game.full #hud,#game.full #hint,#game.full #kit,#game.full #stage{display:none}
#game:not(.menu):not(.full) #panel{display:none}
.stage{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.55);border:1px solid #262c55;touch-action:manipulation;width:var(--sw)}
.kit{border-radius:16px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.5);touch-action:manipulation;width:var(--kw)}
canvas{display:block;width:100%;height:auto}

/* HUD */
.hud{display:grid;grid-template-columns:4.1em minmax(0,1fr) auto;gap:10px;align-items:center;background:linear-gradient(#20264f,#151a39);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 6px 16px rgba(0,0,0,.35);width:var(--kw)}
#game:not(.land) .hud{width:var(--sw)}
.clock{font-family:var(--f-sign);font-size:1.4em;color:var(--bulb);font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(255,209,102,.45);min-width:3.4em}
.hmid{display:flex;flex-direction:column;gap:3px;min-width:0}
.hrow{display:flex;justify-content:space-between;gap:8px;font-size:.8em;color:var(--muted);flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
.hrow b{color:var(--ink);font-variant-numeric:tabular-nums}
.money{display:flex;gap:10px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;font-size:.86em;font-variant-numeric:tabular-nums}
#hRent{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{height:96px}
.money b{font-weight:800}
.bar{height:7px;border-radius:4px;background:#2b3360;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--bulb);transition:width .3s}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#game.rush .hud{border-color:#ff7a45;box-shadow:0 0 0 2px rgba(255,122,69,.45),0 6px 16px rgba(0,0,0,.35);background:linear-gradient(#4a1f2a,#2a1530)}
.mute{border:1px solid var(--line);background:transparent;border-radius:10px;min-width:40px;min-height:36px;display:flex;align-items:center;justify-content:center}
.park{font-size:.78em;font-weight:800;padding:2px 8px;border-radius:999px;background:#253064;font-variant-numeric:tabular-nums;white-space:nowrap}
.park.over{background:var(--bad);color:#2a0b07}
#hint{height:44px;overflow:hidden;line-height:1.3;border-radius:12px;background:rgba(255,209,102,.1);border:1px dashed rgba(255,209,102,.45);color:#ffe3a0;font-size:.88em;font-weight:600;display:flex;align-items:center;padding:5px 12px;width:var(--kw)}
#game:not(.land) #hint{width:var(--sw)}
#hint{display:none} #game.hints #hint{display:flex}
#game.land #kit,#game.land #hud,#game.land #hint{align-self:start}

/* alert banner over scene */
.alert{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(14,16,34,.94);border:2px solid var(--bad);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.alert b{font-size:.92em;color:#ffd7cf}
.alert span{font-size:.78em;color:var(--muted)}
.alert button{grid-row:1/3;grid-column:2;min-height:46px;border-radius:10px;border:0;background:var(--bulb);color:#1b2240;font-weight:800;font-size:.85em;padding:6px 12px;max-width:170px;box-shadow:0 3px 0 #b48c2e}
.alert .cd{font-family:var(--f-sign);color:var(--bad);font-size:1.05em}

/* panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:.73em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rows{display:flex;flex-direction:column}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dotted var(--line);font-size:.93em}
.rows div:last-child{border-bottom:0}
.rows span:last-child{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.btn{min-height:50px;border-radius:12px;font-weight:800;font-size:1em;border:1.5px solid var(--line);background:transparent;padding:8px 14px}
.btn.primary{background:var(--bulb);border-color:var(--bulb);color:#1b2240;box-shadow:0 4px 0 #b48c2e}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #b48c2e}
.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.93em}
.title{font-family:var(--f-sign);color:var(--bulb);font-size:2em;line-height:1.05;text-align:center;text-shadow:0 0 14px rgba(255,209,102,.5);text-wrap:balance}
.sub{text-align:center;color:var(--muted);margin:0}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:.9em;cursor:pointer}
.toggle input{width:22px;height:22px;margin-top:1px;accent-color:var(--bulb);flex:none}
.up{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.up:last-child{border-bottom:0}
.up b{font-size:.95em} .up small{grid-column:1;font-size:.8em;color:var(--muted)}
.up button{grid-row:1/3;grid-column:2;min-height:42px;font-size:.85em;min-width:116px}
.small{font-size:.82em;color:var(--muted)}
.fine{color:var(--bad)} .goodc{color:var(--good)}

/* notebook ledger */
.ledger{background:#f6efd9;color:#24304f;border-radius:6px;padding:14px 16px 16px 44px;font-family:var(--f-hand);font-size:1.15em;line-height:1.55;position:relative;box-shadow:0 10px 24px rgba(0,0,0,.45);
  background-image:linear-gradient(90deg,transparent 30px,#e6a0a0 30px,#e6a0a0 32px,transparent 32px),repeating-linear-gradient(#f6efd9 0 26px,#c9d6ee 26px 27px)}
.ledger h4{margin:0 0 4px;font-family:var(--f-hand);font-size:1.25em;color:#b3261e}
.ledger .l{display:flex;justify-content:space-between;gap:10px}
.ledger .l span:last-child{white-space:nowrap}
.ledger .sec{color:#7a6a4a;font-size:.85em;margin-top:6px}
.ledger .neg{color:#b3261e} .ledger .pos{color:#1d7a46}
.ledger .tot{border-top:2px solid #24304f;margin-top:6px;padding-top:4px;font-size:1.15em}
.advice{background:#fff7d6;color:#5b4a14;border-radius:10px;padding:10px 12px;font-size:.9em;border-left:0}

/* map reviews */
.map{background:#fff;color:#202124;border-radius:14px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.map .mh{padding:14px 16px;border-bottom:1px solid #e8eaed;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.map .big{font-size:2.4em;font-weight:700;line-height:1;grid-row:1/3}
.map .st{color:#f4b400;letter-spacing:1px;font-size:1.05em}
.map .mh small{color:#5f6368}
.rv{padding:12px 16px;border-bottom:1px solid #eef0f2;display:flex;flex-direction:column;gap:6px}
.rv:last-child{border-bottom:0}
.rvh{display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.rvh b{font-size:.95em} .rvh small{display:block;color:#5f6368;font-size:.78em}
.badge{display:inline-block;font-size:.7em;font-weight:700;color:#1a73e8;background:#e8f0fe;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.rv p{margin:0;font-size:.95em;color:#3c4043}
.reply{background:#f1f3f4;border-radius:10px;padding:8px 10px;font-size:.88em;color:#3c4043}
.reply b{display:block;font-size:.85em;color:#202124;margin-bottom:2px}
.rbtns{display:flex;flex-direction:column;gap:6px}
.rbtn{text-align:left;border:1px solid #dadce0;background:#fff;color:#1a73e8;border-radius:10px;padding:8px 10px;font-size:.88em;font-weight:600;min-height:44px}
.rbtn small{display:block;color:#5f6368;font-weight:400;font-size:.85em}

/* modals */
.modal{position:fixed;inset:0;background:rgba(6,8,20,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal .card{max-width:440px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.who{display:flex;gap:10px;align-items:center}
.who b{font-size:1em}
.bubble{background:#f4f1ea;color:#1b2240;border-radius:4px 14px 14px 14px;padding:10px 13px;font-size:.95em}
.choice{text-align:left;display:flex;flex-direction:column;gap:2px;font-weight:700}
.choice small{font-weight:400;font-size:.8em;color:var(--muted)}
.paper{max-width:440px;width:100%;background:#fbf8f0;color:#1d2433;border-radius:4px;padding:18px 18px 16px;box-shadow:0 20px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px;position:relative}
.paper .ph{text-align:center;font-weight:800;letter-spacing:.06em;font-size:1em}
.paper .pn{text-align:center;font-size:.75em;color:#666}
.paper .pr{display:grid;grid-template-columns:7.5em 1fr;gap:4px 10px;font-size:.9em;border-top:1px dashed #b9b2a0;padding-top:8px}
.paper .pr b{color:#555;font-weight:600}
.paper .amt{color:#b3261e;font-weight:800}
.stamp{position:absolute;right:16px;top:44px;border:3px solid #c62828;color:#c62828;border-radius:8px;padding:2px 8px;font-weight:800;transform:rotate(-12deg);opacity:.8;font-size:.85em}
.paper .tip{background:#eef6ff;color:#1d3b66;border-radius:8px;padding:8px 10px;font-size:.85em}
textarea{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.88em;background:var(--night);color:var(--ink);resize:none;user-select:text}
.nextopt{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px dotted var(--line)}.nextopt:last-child{border-bottom:0}
.nextopt small{color:var(--muted);font-size:.82em;line-height:1.45}.nextopt .btn{margin-top:6px}
.pickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{text-align:left;display:flex;flex-direction:column;gap:3px;padding:10px;border-radius:10px;background:#0f1430;border:1.5px solid var(--line);color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.pick.on{border-color:var(--bulb);background:#26240f;box-shadow:0 0 0 2px rgba(255,209,102,.25)}
.pick:disabled{opacity:.4;cursor:default}
.pick b{font-size:.92em}.pick small{font-size:.76em;color:var(--muted);line-height:1.35}.pick .pm{color:#9fb0d8}
.pick .pc{font-size:.8em;font-weight:800;color:var(--bulb);margin-top:4px}.pick .pi{font-size:1.5em;line-height:1}
.sharecard img{width:100%;max-width:420px;display:block;margin:4px auto 10px;border-radius:12px;aspect-ratio:1080/1350;background:#0b1030;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.gold{background:linear-gradient(#ffe08a,#f2a93b);border-color:#f2a93b;color:#2a1a00;box-shadow:0 4px 0 #a8701e}
.btn.gold:active{transform:translateY(2px);box-shadow:0 2px 0 #a8701e}
.chcard{border-color:rgba(255,209,102,.55);background:linear-gradient(160deg,#2a2440,#161b35 60%)}
.chcard .chm{font-size:1.15em;font-weight:800}.chcard small{color:var(--muted);font-size:.84em;line-height:1.45}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{min-height:40px;padding:6px 4px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:.8em;cursor:pointer}
.tab.on{background:var(--bulb);border-color:var(--bulb);color:#1b2240}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.brow{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 6px;border-bottom:1px dotted var(--line)}
.brow:last-child{border-bottom:0}.brow.me{background:rgba(255,209,102,.13);border-radius:8px}
.brow .rk{font-weight:800;text-align:center;color:var(--muted)}.brow .rk.t1{color:#ffd166}.brow .rk.t2{color:#d9dee8}.brow .rk.t3{color:#e0a36b}
.brow .nk{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brow small{display:block;color:var(--muted);font-size:.76em;font-weight:500}
.brow .sc{font-weight:800;font-variant-numeric:tabular-nums}
.bgap{text-align:center;color:var(--muted);font-size:.8em;padding:2px 0}
.nickrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.nickrow input{min-width:0;min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:var(--night);color:var(--ink)}
.rankbig{font-family:var(--f-sign);font-size:2.1em;color:var(--bulb);text-align:center;line-height:1.1}
.rankbig small{display:block;font-family:inherit;font-size:.38em;color:var(--muted)}.sharecard textarea{margin-top:8px}
.volrow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.85em;color:var(--muted)}.volrow input{flex:1;accent-color:var(--bulb)}
.lsg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.lsg div{background:#0f1430;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.lsg small{display:block;color:var(--muted);font-size:.75em}.lsg b{font-size:1.25em}
.ldet{margin-top:10px}.ldet summary{cursor:pointer;font-weight:700;color:var(--bulb);padding:8px 0;min-height:32px}
.endgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.endgrid div{border-radius:8px;padding:8px 6px;font-size:.78em;font-weight:700;text-align:center;background:#0f1430;border:1px solid var(--line);color:var(--muted)}
.endgrid div.cur{background:var(--bulb);color:#1b2240;border-color:var(--bulb)}
</style>
</head>
<body>

<div id="app">
  <div id="game" class="menu">
    <div id="hud"></div>
    <div id="hint" aria-live="polite"></div>
    <div class="stage" id="stage"><canvas id="cv" width="360" height="500" aria-label="Cảnh quán nhậu vỉa hè. Chạm vào bàn để mang món hoặc thu tiền."></canvas><div id="ov"></div></div>
    <div class="kit" id="kit"><canvas id="kc" width="360" height="240" aria-label="Bếp và khay. Chạm vào món ở bếp để lấy lên khay, chạm món trên khay để bỏ."></canvas></div>
    <div id="panel"></div>
  </div>
</div>
<div id="modal"></div>

<script>
(function(){
"use strict";
/* ================= constants & data ================= */
const W=360,SH=500,KH=240;
const START=1000000,NIGHT_MIN=360,CLOSE_MIN=600,MPS=4;
/* business models: each has its own menu, stations, look and flavour text */
const MODELS={

      if(G.t>=NIGHT_MIN||(isOuter(i)&&G.t<G.outerClosed)||G.broken[i]) return;

function freeInsideSlot(){for(let i=0;i<Math.min(4,G.tables.length);i++)if(!G.tables[i]&&!G.broken[i])return i;return -1;}
function runQueued(e){

  if(id.startsWith("seat:")){const i=freeInsideSlot();if(i<0||G.t>=NIGHT_MIN-30){if(G.t<NIGHT_MIN-30){G.evq.push({id,at:G.t+12});G.evq.sort((a,b)=>a.at-b.at);}return;}
    const kind=id.slice(5); seat(i,null,"ev:"+kind); const tb=G.tables[i]; G.evTable=i;
    if(kind==="ship"){tb.ship=true;tb.tay=false;tb.size=1;tb.faces=[{skin:pick(SKINS),hair:pick(HAIRC),style:"helmet",shirt:"#16a34a",ph:RNG()*6,ship:true}];tb.bikes=1;tb.rounds=1;tb.order=genOrder(true,2,null);toast(`Có đơn giao hàng qua app! Shipper chờ ở bàn ${i+1}.`,true);SFX.notif();return;}
    if(kind==="tiktok"){tb.kol=true;tb.faces[0].gimbal=true;G.ev="kolfree";}
    else {tb.tay=true;tb.faces.forEach(f=>{f.skin=pick(["#f6c9b3","#f2bfa6","#f8d3c0"]);f.hair=pick(["#e8c56b","#d9a84e","#c8662e"]);f.style=pick(["short","long"]);f.shirt=pick(["#2fa3c4","#f2f2f2","#e9b949","#4c8a54"]);});G.ev="taygia";}
    return;}
  if(id.startsWith("arm:")){G.armed[id.slice(4)]=true;return;}
  if(id.startsWith("reg:")){const r=id.slice(4),reg=r==="ghiso"?"bay":"hung";if(G.regs[reg].gone)return;
    if(!G.tables.some(tb=>tb&&tb.reg===reg)&&!G.regq.some(q=>q.id===reg)) G.regq.unshift({id:reg,at:G.t});
    G.armed[r]=true; return;}
  if(id==="quay"){const occ=G.tables.map((t,i)=>t?i:-1).filter(i=>i>=0);if(!occ.length){if(G.t<NIGHT_MIN-40){G.evq.push({id,at:G.t+15});G.evq.sort((a,b)=>a.at-b.at);}return;}G.evTable=pick(occ);G.ev=id;return;}
  const d=EV[id]; if(d&&(!d.cond||d.cond())) G.ev=id;
}
function bikesCount(){return G.tables.reduce((a,tb)=>a+(tb?tb.bikes:0),0);}

    trayPut(id,false); kfx("−"+k(it.cost),b.x+b.w/2,b.y+16,"#c9d1e6"); SFX.pick(); return;
  }
  const slots=G.st[it.st], done=slots.find(s=>s.done);
  if(done){ if(G.tray.length>=trayCap()){toast("Khay đầy. Mang món ra bàn trước.",false);return;}
    const perf=done.wait<=PERFECT; trayPut(id,perf); G.st[it.st]=slots.filter(s=>s!==done);

  if(slots.length<capOf(it.st)){const tt=it.time*(G.cookMul||1);slots.push({item:id,left:tt,total:tt,done:false,wait:0});kfx("−"+k(it.cost),b.x+b.w/2,b.y+16,"#c9d1e6");SFX.sizzle();return;}
  toast("Bếp đang bận, chờ món chín đã.",false);
}

function trayPut(id,perf){G.tray.push(id);if(!G.trayP)G.trayP=[];while(G.trayP.length<G.tray.length-1)G.trayP.push(false);G.trayP.push(!!perf);}

function tapTable(i){
  if(G.screen!=="play"||G.ev||G.evRes||G.bb||G.anim) return;
  const tb=G.tables[i]; if(!tb) return; const [cx,cy]=SLOT[i];

    if(tb.reg==="bay"&&G.armed.ghiso){G.armed.ghiso=false;G.ev="ghiso";G.evTable=i;return;}
    if(G.armed.ckgia&&!tb.reg&&!tb.kol&&!tb.tay&&!tb.ship&&tb.bill>=60000){G.armed.ckgia=false;G.ckFake=RNG()<.45;G.ev="ck";G.evTable=i;return;}

      const it=ITEMS[line.item], pr=Math.round(it.price*N().price/1000)*1000*(tb.markup||1); tb.bill+=pr; val+=pr; G.ns.costSold+=it.cost; tb.p=Math.min(100,tb.p+14+(perf?10:0)); tb.ate[line.item]=1;
      if(perf){perfN++;tb.perfect=(tb.perfect||0)+1;G.ns.perfect++;} if(it.bottle) SFX.pour();
      if(it.bottle)tb.bottles+=2; else if(it.ice)tb.ice=true; else if(it.cup){tb.cups.push(line.item);if(tb.cups.length>4)tb.cups.shift();} else {tb.dishes.push(line.item);if(tb.dishes.length>3)tb.dishes.shift();}}
  });
  if(!n){toast(`Bàn ${i+1} chưa cần món đang có trên khay.`,false);return;}
  fx("+"+k(tb.bill)+" vào hóa đơn",cx,cy-30,"#cfe9ff");
  if(perfN) fx("Món vàng ruộm, khách khen!",cx,cy+40,"#ffd166");

    else {tb.phase="bill";tb.p=100;if(MODEL().alcohol)tb.drunk++;}
  }
}

function legSum(leg){const hs=G.hist.filter(h=>h.leg===leg);return {n:hs.length,profit:hs.reduce((a,h)=>a+h.profit,0),served:hs.reduce((a,h)=>a+h.ns.served,0),fines:hs.reduce((a,h)=>a+h.ns.fines.reduce((b,f)=>b+f.v,0),0),shop:hs.length?hs[0].shop:G.shop.name};}
function passiveOf(){const L=legSum(G.leg);return Math.max(150000,Math.round(Math.max(0,L.profit/Math.max(1,L.n))*.5/10000)*10000);}
function continueLeg(){G.leg++;G.legStart=G.night;G.plan=makePlan(G.shop.model,G.shop.district);G.screen="shop";}
function expandCost(m,d){return MODELS[m].setup+DIST[d].deposit;}
function owned(m,d){return (G.shop.model===m&&G.shop.district===d)||G.branches.some(b=>b.model===m&&b.district===d);}
function confirmExpand(m,d){
  if(!MODELS[m]||!DIST[d]||owned(m,d)) return false; const cost=expandCost(m,d); if(G.money<cost) return false;
  G.branches.push({name:G.shop.name,model:G.shop.model,district:G.shop.district,passive:passiveOf()});
  G.money-=cost; G.setupPaid={l:`Mở ${MODELS[m].name} ở ${DIST[d].name}: đồ nghề ${vnd(MODELS[m].setup)}${DIST[d].deposit?`, cọc mặt bằng ${vnd(DIST[d].deposit)}`:""}`,v:cost};
  G.shop={model:m,district:d,name:MODELS[m].name}; G.leg++; G.legStart=G.night; G.plan=makePlan(m,d);
  for(const k in G.up) G.up[k]=0; G.flags.dirty=false; G.flags.fakeBeer=false; G.rSum=4.0*10; G.rN=10; G.replyBonus=0; G.appR=4.6; G.viralNext=0; G.seizedNext=0; G.pendingExtra=[];
  for(const r in G.regs){G.regs[r].gone=false;G.regs[r].plus=false;}
  G.st={}; useModel(m); G.st=freshSt(); G.pick={}; buildStatic(); startNight(); return true;
}
function tutTarget(){
  if(!G.tut||G.screen!=="play"||G.ev||G.evRes||G.bb||G.anim||G.alert) return null;
  const bi=G.tables.findIndex(t=>t&&t.phase==="bill"); if(bi>=0) return {k:"table",i:bi};
  for(const id of ALLM){const it=ITEMS[id];if(it.st&&G.st[it.st].some(s=>s.done))return {k:"station",id};}
  for(let i=0;i<G.tables.length;i++){const t=G.tables[i];if(t&&t.phase==="order"&&t.order.some(l=>l.need>0&&G.tray.includes(l.item)))return {k:"table",i};}
  const need={};G.tables.forEach(t=>{if(t&&t.phase==="order")t.order.forEach(l=>{need[l.item]=(need[l.item]||0)+l.need;});});
  G.tray.forEach(id=>need[id]--); for(const key in G.st) G.st[key].forEach(s=>need[s.item]--);
  for(const id of ALLM){const it=ITEMS[id];if(need[id]>0&&N().menu.includes(id)&&(it.kind!=="cook"||G.st[it.st].length<capOf(it.st)))return {k:"station",id};}
  return null;
}
function drawArrow(c,x,y,t,rot){const b=Math.abs(Math.sin(t*5))*8;c.save();c.translate(x,y);c.rotate(rot||0);c.translate(0,-b);c.fillStyle="#ffd166";c.strokeStyle="#1b2240";c.lineWidth=2.5;
  c.beginPath();c.moveTo(0,0);c.lineTo(-13,-16);c.lineTo(-5,-16);c.lineTo(-5,-32);c.lineTo(5,-32);c.lineTo(5,-16);c.lineTo(13,-16);c.closePath();c.stroke();c.fill();c.restore();}
function hintText(){
  if(G.screen!=="play"||nil()>2) return "";
  if(G.tut&&G.t<20&&!G.tables.some(t=>t)) return "Đêm đầu tiên: làm theo mũi tên vàng. Khách sắp tới!";
  if(G.alert) return "Bấm nút trên khung cảnh báo trước khi hết giờ!";
  const bi=G.tables.findIndex(t=>t&&t.phase==="bill"); if(bi>=0) return `Bàn ${bi+1} gọi tính tiền: chạm vào bàn để thu.`;
  for(const id of ALLM){const it=ITEMS[id];if(it.st&&G.st[it.st].some(s=>s.done))return `${it.name} xong rồi: chạm vào quầy để lấy lên khay, để lâu sẽ cháy.`;}
  for(let i=0;i<G.tables.length;i++){const t=G.tables[i];if(t&&t.phase==="order"&&t.order.some(l=>l.need>0&&G.tray.includes(l.item)))return `Khay có món bàn ${i+1} cần: chạm vào bàn ${i+1} để mang ra.`;}
  {const sh=(G.ships||[]).find(s=>s.state==="wait"&&s.order.some(l=>l.need>0&&G.tray.includes(l.item)));if(sh)return `Khay có món shipper ${APPS[sh.app].name} cần: chạm vào shipper ở lề đường.`;}
  const need={};G.tables.forEach(t=>{if(t&&t.phase==="order")t.order.forEach(l=>{need[l.item]=(need[l.item]||0)+l.need;});});
  (G.ships||[]).forEach(s=>{if(s.state==="wait")s.order.forEach(l=>{need[l.item]=(need[l.item]||0)+l.need;});});
  G.tray.forEach(id=>need[id]--); for(const key in G.st) G.st[key].forEach(s=>need[s.item]--);
  const ord=ALLM.filter(id=>ITEMS[id].kind==="cook").concat(ALLM.filter(id=>ITEMS[id].kind!=="cook"));
  for(const id of ord) if(need[id]>0){const it=ITEMS[id];return it.kind==="cook"?`Có bàn gọi ${it.name.toLowerCase()}: chạm quầy ${it.name.toLowerCase()} để làm (${it.time} giây).`:`Có bàn gọi ${it.name.toLowerCase()}: chạm quầy ${it.name.toLowerCase()} để lấy lên khay.`;}
  return G.tables.some(t=>t)?"Đang chờ khách. Chỉ lấy món khi có bàn gọi, món thừa sẽ mất vốn.":"Chờ khách tới…";
}

function reply(idx,o){
  const rv=G.ns.reviews[idx]; if(!rv||rv.reply) return;
  const opt=replyOptions(rv)[+o]; if(!opt) return;
  rv.reply=opt.text; G.replyBonus+=opt.eff; if(opt.eff>0){if(!G.traits)G.traits={k:0,r:0,c:0,t:0};G.traits.t++;} if(opt.react) rv.react=opt.react; else if(opt.eff>=.05) rv.react="8 người thấy phản hồi này hữu ích";
  if(opt.cost) G.pendingExtra.push({l:opt.winBack?`Mời ${REGX[rv.reg]} chai bia theo lời hứa`:`Tặng ${MODEL().gift} theo lời hứa khi trả lời đánh giá`,v:opt.cost});
  if(opt.winBack&&rv.reg&&Math.random()<.75){G.regs[rv.reg].gone=false;rv.react=`${rv.reg==="sv"?"Các bạn":REGX[rv.reg].replace(/^./,c=>c.toUpperCase())} đã trả lời: “Ok, mai ghé!”`;}
  if(opt.thanks&&rv.reg) G.regs[rv.reg].plus=true;
  G.replyBonus=cl(G.replyBonus,-.3,.3);
}

function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}}

const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function rpc(fn,args){
  const ctl=typeof AbortController!=="undefined"?new AbortController():null, to=setTimeout(()=>{if(ctl)ctl.abort();},10000);
  try{const r=await fetch(RANK.url.replace(/\/+$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:Object.assign({apikey:RANK.key,"Content-Type":"application/json"},/^eyJ/.test(RANK.key)?{Authorization:"Bearer "+RANK.key}:{}),body:JSON.stringify(args),signal:ctl?ctl.signal:undefined});
    let j=null;try{j=await r.json();}catch(e){}
    if(!r.ok)throw new Error((j&&(j.message||j.hint))||("HTTP "+r.status));
    if(j&&j.error)throw new Error(j.error);

async function ensurePlayer(){let p=lsGet(PKEY);if(p&&p.id&&p.secret)return p;

  const o=Object.assign({},G,{fx:[],kfx:[],notif:null,toastMsg:null});localStorage.setItem(SAVE_KEY,JSON.stringify(o));}catch(e){}}

function resumeGame(){const o=loadSave();if(!o)return;const m=G.mute;G=o;G.mute=m;ensureFields();if(G.screen==="play")G.screen="nightstart";useModel();buildStatic();}
function ensureFields(){const f=fresh();for(const k in f){if(G[k]===undefined)G[k]=f[k];}if(!G.traits)G.traits={k:0,r:0,c:0,t:0};}
let lastScreen=null;
function setLayoutClass(){
  const s=G.screen; $game.classList.toggle("hints",s==="play"&&nil()<=2); $game.classList.toggle("menu",s==="title"||s==="nightstart"); $game.classList.toggle("full",["ledger","broke","reviews","shop","ending","chang","expand","chres","board"].includes(s));
}
function layout(){
  const vw=window.innerWidth||400, vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight||800;
  const land=vw>=680&&vw/vh>1.05; $game.classList.toggle("land",land);
  let sw,kw;
  if(land){
    const avail=vh-28; sw=Math.min(avail*W/SH,(vw-64)*.56);
    kw=Math.min(vw-64-sw-16, sw*1.05); const hudH=118; kw=Math.min(kw,(avail-hudH)*W/KH); kw=Math.max(kw,300);
  } else {
    const hudH=124, avail=vh-26-hudH-24, tot=(SH+KH)/W;
    sw=Math.min(vw-32, Math.max(Math.min(vw-32,330), avail/tot), 760); kw=sw;
  }
  document.documentElement.style.setProperty("--sw",Math.floor(sw)+"px");
  document.documentElement.style.setProperty("--kw",Math.floor(kw)+"px");
  DPR=Math.min(2.5,window.devicePixelRatio||1);
  const cw=Math.round(sw*DPR), kwp=Math.round(kw*DPR);
  if(cv.width!==cw){cv.width=cw;cv.height=Math.round(cw*SH/W);buildStatic();}
  if(kc.width!==kwp){kc.width=kwp;kc.height=Math.round(kwp*KH/W);}
}
function renderUI(force){
  if(G.screen!==lastScreen||force){lastScreen=G.screen;setLayoutClass();renderPanel();saveGame();window.scrollTo&&window.scrollTo(0,0);}
  if(G.screen==="play"){updHud();const h=hintText()||"\u00a0";if($hint.textContent!==h)$hint.textContent=h;}
  updOverlay();updModal();
}
